<!DOCTYPE html>
<html>
<head>
<title>KENLY DEV</title>

<style>
:root {
  --bg: #030405;
  --panel: rgba(10, 15, 18, 0.85);
  --accent: #00eaff;
  --danger: #ff2a2a;
  --text: #9fbec4;
  --muted: #4f6a70;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: "Consolas", monospace;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}

/* BACKGROUND CANVAS */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* DARK VIGNETTE */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9));
  pointer-events: none;
}

/* CONTAINER */
.container {
  width: 380px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.title {
  color: var(--accent);
  font-size: 14px;
  letter-spacing: 2px;
}

.status {
  font-size: 11px;
  color: #00ff88;
}

/* PANEL */
.panel {
  background: var(--panel);
  border: 1px solid rgba(0, 234, 255, 0.12);
  padding: 20px;
  border-radius: 6px;
  backdrop-filter: blur(6px);
}

/* LABEL */
.label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  background: #020304;
  border: 1px solid rgba(0, 234, 255, 0.2);
  color: var(--accent);
  outline: none;
  margin-bottom: 10px;
}

input:focus {
  border-color: var(--accent);
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  cursor: pointer;
  transition: 0.2s;
  letter-spacing: 1px;
}

button:hover {
  background: var(--accent);
  color: black;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: #111;
  margin-top: 10px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
}

/* COUNTER */
.counter {
  font-size: 11px;
  margin-top: 5px;
  color: var(--muted);
}

/* TERMINAL */
.terminal {
  margin-top: 10px;
  background: #010203;
  border: 1px solid rgba(0, 234, 255, 0.12);
  padding: 10px;
  height: 160px;
  overflow: auto;
  font-size: 12px;
  line-height: 1.4;
}

/* RED FLICKER (scary effect) */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.95; }
}

.panel {
  animation: flicker 4s infinite;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

  <div class="header">
    <div class="title">KENLY DEV CONSOLE</div>
    <div class="status">● ONLINE</div>
  </div>

  <div class="panel">

    <div class="label">TARGET</div>
    <input id="target" placeholder="Enter target">

    <button onclick="run()">EXECUTE</button>

    <div class="progress">
      <div id="progress" class="progress-fill"></div>
    </div>

    <div class="counter" id="counter">Idle</div>

    <div class="terminal" id="log"></div>

  </div>

</div>

<script>
// ===== DARK SCARY BACKGROUND =====
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3
  });
}

function draw() {
  ctx.fillStyle = "#030405";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // dark red fog pulses
  let gradient = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, 0,
    canvas.width/2, canvas.height/2, canvas.width/1.5
  );
  gradient.addColorStop(0, "rgba(255,0,0,0.05)");
  gradient.addColorStop(1, "transparent");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 120) {
        ctx.strokeStyle = "rgba(0,234,255," + (1 - dist/120) * 0.15 + ")";
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  // nodes
  particles.forEach(p => {
    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  });

  requestAnimationFrame(draw);
}

draw();

// ===== APP LOGIC =====
function validate(input) {
  return input.length >= 5;
}

async function run() {
  const input = document.getElementById("target");
  const log = document.getElementById("log");
  const progress = document.getElementById("progress");
  const counter = document.getElementById("counter");

  if (!validate(input.value)) {
    input.style.borderColor = "red";
    return;
  }

  log.innerHTML = "Initializing...\n";
  progress.style.width = "0%";
  counter.innerText = "Starting...";

  const total = 14;
  let count = 0;

const res = await fetch("https://kenly-dev.onrender.com/run", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({
    target: input.value,
    batches: 1,
    delay: 1
  })
});

  const reader = res.body.getReader();
  const decoder = new TextDecoder();

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;

    const lines = decoder.decode(value).trim().split("\n");

    for (let line of lines) {
      const data = JSON.parse(line);

      log.innerText += `> OP ${data.operation} : ${data.status}\n`;

      count++;
      progress.style.width = (count / total * 100) + "%";
      counter.innerText = `Processing ${count}/${total}`;

      log.scrollTop = log.scrollHeight;
    }
  }

  counter.innerText = "Completed";
}
</script>

</body>
</html>
